  <!-- Plus / Plugin Badge overlapping bottom-right curve with crisp pop -->
  <g transform="translate(172, 163)" filter="url(#badgeElevation)">
    <circle cx="0" cy="0" r="23.5" fill="url(#ersaalGold)" />
    <!-- Bold Navy Plus Icon -->
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#0C154A" stroke-width="7.2" stroke-linecap="round" />
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#0C154A" stroke-width="7.2" stroke-linecap="round" />
  </g>
</svg>