<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#1E2E88" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#141E66" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0A113C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182574" />
      <stop offset="50%" stop-color="#121B5A" />
      <stop offset="100%" stop-color="#0A103D" />
    </linearGradient>

    <!-- Ersaal Corporate Gold Gradient -->
    <linearGradient id="ersaalGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="28%" stop-color="#FFD214" />
      <stop offset="70%" stop-color="#FFBD0A" />
      <stop offset="100%" stop-color="#F29E00" />
    </linearGradient>

    <!-- Base Emblem Elevation Shadow -->
    <filter id="markElevation" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#04081E" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#04081E" flood-opacity="0.38" />
    </filter>

    <!-- Badge Specific Pop Shadow -->
    <filter id="badgeElevation" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#04081E" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#04081E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed brand canvas -->
  <rect width="256" height="256" fill="url(#tileBg)" />
  <rect width="256" height="256" fill="url(#ambientGlow)" />
  
  <!-- Subtle telecom orbits matching brand guidelines -->
  <circle cx="128" cy="122" r="80" fill="none" stroke="rgba(80, 110, 215, 0.22)" stroke-width="1.2" />
  <circle cx="128" cy="122" r="104" fill="none" stroke="rgba(80, 110, 215, 0.18)" stroke-width="1.2" stroke-dasharray="4 6" />

